# Move this file to .github/workflows/update-leagues.yml in your GitHub repository to turn on automatic league updates.
# Checks poe.ninja every 6 hours and updates leagues.json when a new league starts,
# so the "Find Builds" button always opens the current league.
name: Update current leagues

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-leagues.mjs
      - name: Commit if a league changed
        run: |
          if ! git diff --quiet -- leagues.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add leagues.json
            git commit -m "Update current leagues"
            git push
          fi
